<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Log In - Toughcuts</title>
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/png" href="assets/toughcutslogo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-login-page">

    <div class="admin-login-card">
        <span class="admin-login-badge"><i class="fas fa-scissors" aria-hidden="true"></i> TOUGHCUTS STAFF</span>
        <h1 class="admin-login-title">Admin Log In</h1>
        <p class="admin-login-sub">Staff access only — this isn't the customer login.</p>

        <div class="admin-error" id="loginError" role="alert" hidden></div>
        <div class="admin-notice" id="deniedNotice" role="status" hidden>
            <i class="fas fa-circle-info" aria-hidden="true"></i>
            <span>That account doesn't have admin access.</span>
        </div>

        <form id="adminLoginForm" class="admin-form" novalidate>
            <div class="admin-field">
                <label for="adminEmail">Email Address</label>
                <input type="email" id="adminEmail" class="admin-input" placeholder="you@toughcuts.com" autocomplete="email" autofocus />
            </div>

            <div class="admin-field">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" class="admin-input" placeholder="••••••••" autocomplete="current-password" />
            </div>

            <button type="submit" class="admin-submit" id="adminLoginBtn">
                <span id="adminLoginBtnText">Log In</span>
                <i class="fas fa-circle-notch fa-spin" id="adminLoginSpinner" aria-hidden="true" hidden></i>
            </button>
        </form>

        <a href="https://barbershopsystem-nine.vercel.app/" class="admin-back-link">
            <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Toughcuts
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="admin-auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
